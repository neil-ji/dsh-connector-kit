name: release

# 发布工作流：打 tag vX.Y.Z -> 构建/测试 -> npm 发布三包 -> 更新 GitHub Pages（落地页 + 文档页）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # trusted publishing (OIDC) requires npm >= 11.5.1
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align package versions
        run: pnpm -r exec npm pkg set version="$VERSION"

      - name: Build (lib/ is gitignored, must exist for cross-package typecheck)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Publish to npm (OIDC trusted publishing)
        # npm CLI >= 11.5.1 exchanges the GitHub Actions OIDC id-token for a
        # registry token automatically (ACTIONS_ID_TOKEN_REQUEST_URL); publish
        # in dependency order (wire -> ui -> host) so workspace:^ resolves.
        run: |
          npm publish --access public -w dsh-github-connector-wire
          npm publish --access public -w dsh-github-connector-ui
          npm publish --access public -w dsh-github-connector

      - name: Build Pages site
        run: |
          sed -i "s/__DSH_VERSION__/${VERSION}/g" site/landing/index.html site/docs/index.html
          rm -rf site-dist
          mkdir -p site-dist/docs
          cp site/landing/index.html site-dist/index.html
          cp site/docs/index.html site-dist/docs/index.html
          cp -r site/assets site-dist/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - uses: actions/deploy-pages@v4
